<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Circuit / Pathway Connections -->
  <path d="M100 82 V112 M100 112 H58 V136 M100 112 H142 V136" 
        fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Subcourse Target Nodes -->
  <circle cx="58" cy="146" r="14" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="58" cy="146" r="6" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="142" cy="146" r="14" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="142" cy="146" r="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- Master Course Graduation Cap -->
  <g filter="url(#glow)">
    <!-- Cap Diamond -->
    <polygon points="100,28 152,48 100,68 48,48" fill="url(#orangeGrad)"/>
    <!-- Cap Skullcap Base -->
    <path d="M68 56 V68 C68 78 132 78 132 68 V56" fill="#C2410C"/>
    <!-- Tassel -->
    <path d="M100 48 L142 56 V72" fill="none" stroke="#FED7AA" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="142" cy="74" r="3" fill="#FED7AA"/>
  </g>

  <!-- Central Enrolment Key / Checkmark Badge -->
  <g transform="translate(100, 108)">
    <circle cx="0" cy="0" r="22" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Checkmark & Key Head -->
    <path d="M -8 -1 L -2 5 L 9 -6" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 22 V 36 M 0 28 H 5 M 0 34 H 4" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>